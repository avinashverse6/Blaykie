name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [armeabi-v7a, arm64-v8a]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            automake \
            libltdl-dev \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install "pip==24.0"
          python -m pip install "buildozer==1.5.0" "cython==0.29.37"

      - name: Choose the processor type
        run: sed -i "s/^android.archs = .*/android.archs = ${{ matrix.arch }}/" buildozer.spec

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ matrix.arch }}-${{ hashFiles('buildozer.spec', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-${{ matrix.arch }}-

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          : > build-log.txt
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt of 3 ===" | tee -a build-log.txt
            if buildozer -v android debug 2>&1 | tee -a build-log.txt; then
              exit 0
            fi
            echo "Build attempt $attempt failed." >&2
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blaykie-${{ matrix.arch }}-APK
          path: bin/*.apk
          if-no-files-found: error
