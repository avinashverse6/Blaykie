name: Build native Android APK

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi
      - name: Verify Rhino POM metadata
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.7.15/rhino-1.7.15.pom -o /tmp/blaykie-rhino.pom
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/blaykie-rhino.pom').getroot()
          ns = {'p': 'http://maven.apache.org/POM/4.0.0'}
          version = root.findtext('p:version', namespaces=ns)
          licenses = [(x.findtext('p:name', namespaces=ns), x.findtext('p:url', namespaces=ns)) for x in root.findall('p:licenses/p:license', ns)]
          print('Rhino version:', version)
          print('Rhino POM licenses:', licenses)
          print('::notice::Rhino POM version ' + str(version) + ', licenses ' + str(licenses))
          assert version == '1.7.15' and licenses, 'Missing or unexpected Rhino POM metadata'
          PYCODE
      - name: Run unit tests and build debug APK
        env:
          BLAYKIE_SAMPLE_DIR: ${{ github.workspace }}/native/app/build/sample-docx-csl
        working-directory: native
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug > /tmp/blaykie-gradle.log 2>&1
          status=$?
          cat /tmp/blaykie-gradle.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          import re
          lines = open('/tmp/blaykie-gradle.log').read().splitlines()
          matches = [line for line in lines if re.search(r'(^e: |FAILED|Exception|Error|error:|What went wrong|failure)', line, re.I)]
          for line in matches[-40:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          if [ "$status" -eq 0 ]; then
            python3 - <<'PYCODE'
          import base64, glob, zlib, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*CslSpikeTest.xml'):
              root = ET.parse(path).getroot()
              text = root.findtext('system-out', '')
              rows = [line for line in text.splitlines() if line.startswith('COMPARISON_ROW ')]
              if rows:
                  payload = base64.b64encode(zlib.compress('\n'.join(rows).encode('utf-8'))).decode('ascii')
                  print('::notice::COMPARISON_ROWS ' + payload)
              for line in text.splitlines():
                  if line.strip() and not line.startswith('COMPARISON_ROW '): print('::notice::' + line.replace('%', '%25'))
          PYCODE
          fi
          exit "$status"
      - name: Verify release isolation and compare APK sizes
        working-directory: native
        run: |
          ./gradlew assembleRelease
          python3 - <<'PYCODE'
          import glob, zipfile
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          with zipfile.ZipFile(apk) as z:
              assets = [n for n in z.namelist() if n.startswith('assets/')]
              print('Release APK assets:', *assets, sep='\n')
              assert not any('csl/' in n.lower() or 'citeproc' in n.lower() for n in assets)
              for name in z.namelist():
                  if name.endswith('.dex'):
                      data = z.read(name)
                      assert b'org/blaykie/nativeapp/csl/' not in data
                      assert b'CslWebViewHost' not in data
                      assert b'StyleController' not in data
                      assert b'Citation style' not in data
                      assert b'org/mozilla/javascript/Context' not in data
          print('Release isolation verified:', apk)
          print('::notice::Release assets: ' + (', '.join(assets) if assets else '(none)') + '; no spike or Rhino classes found')
          PYCODE
          baseline=$(mktemp -d)
          git -C .. archive ba3e3c3157d732dad2269f1b9c518ffa64922b5c native | tar -x -C "$baseline"
          (cd "$baseline/native" && ./gradlew assembleDebug)
          base=$(stat -c %s "$baseline/native/app/build/outputs/apk/debug/app-debug.apk")
          spike=$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)
          echo "Baseline debug APK: $base bytes; spike debug APK: $spike bytes; increase: $((spike-base)) bytes"
          echo "::notice::Baseline debug APK: $base bytes; spike debug APK: $spike bytes; increase: $((spike-base)) bytes"
      - name: Inventory optional-processor markers in release APK
        working-directory: native
        run: |
          python3 - <<'PYCODE'
          import glob, struct, zipfile
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          def strings(data):
              size, off = struct.unpack_from('<II', data, 56)
              for i in range(size):
                  pos = struct.unpack_from('<I', data, off + i * 4)[0]
                  while data[pos] & 128: pos += 1
                  pos += 1
                  end = data.index(b'\0', pos)
                  yield data[pos:end].decode('utf-8', 'replace')
          with zipfile.ZipFile(apk) as z:
              assets = [n for n in z.namelist() if n.startswith('assets/') and ('csl' in n.lower() or 'citeproc' in n.lower())]
              print('Optional processor assets:', assets or '(none)')
              print('::notice::Optional processor assets: ' + (', '.join(assets) if assets else '(none)'))
              for name in z.namelist():
                  if name.endswith('.dex'):
                      matches = sorted(set(s for s in strings(z.read(name)) if 'csl' in s.lower() or 'citeproc' in s.lower() or 'rhino' in s.lower()))
                      print(name + ' matching strings:')
                      for match in matches: print('  ' + repr(match))
                      if not matches: print('  (none)')
                      for match in matches:
                          escaped = repr(match).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::notice::' + name + ' marker: ' + escaped)
          PYCODE
      - name: List release dependency and APK license and notice filenames
        working-directory: native
        run: python3 ci/list-release-licenses.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: |
            native/app/build/reports/tests
            native/app/build/test-results
      - name: Upload sample DOCX files
        uses: actions/upload-artifact@v4
        with:
          name: sample-docx-csl
          path: native/app/build/sample-docx-csl/*.docx
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Blaykie-native-debug
          path: native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
