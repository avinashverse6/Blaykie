name: Build native Android APK

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi
      - name: Verify Rhino POM metadata
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.7.15/rhino-1.7.15.pom -o /tmp/blaykie-rhino.pom
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/blaykie-rhino.pom').getroot()
          ns = {'p': 'http://maven.apache.org/POM/4.0.0'}
          version = root.findtext('p:version', namespaces=ns)
          licenses = [(x.findtext('p:name', namespaces=ns), x.findtext('p:url', namespaces=ns)) for x in root.findall('p:licenses/p:license', ns)]
          print('Rhino version:', version)
          print('Rhino POM licenses:', licenses)
          print('::notice::Rhino POM version ' + str(version) + ', licenses ' + str(licenses))
          assert version == '1.7.15' and licenses, 'Missing or unexpected Rhino POM metadata'
          PYCODE
      - name: Run unit tests and build debug APK
        env:
          BLAYKIE_SAMPLE_DIR: ${{ github.workspace }}/native/app/build/sample-docx-csl
        working-directory: native
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug > /tmp/blaykie-gradle.log 2>&1
          status=$?
          cat /tmp/blaykie-gradle.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          import re
          lines = open('/tmp/blaykie-gradle.log').read().splitlines()
          matches = [line for line in lines if re.search(r'(^e: |FAILED|Exception|Error|error:|What went wrong|failure)', line, re.I)]
          for line in matches[-40:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          if [ "$status" -eq 0 ]; then
            python3 - <<'PYCODE'
          import base64, glob, zlib, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*CslExportSamplesTest.xml'):
              text = ET.parse(path).getroot().findtext('system-out', '')
              for line in text.splitlines():
                  if line.startswith('CSL_SAMPLE_XML '): print('::notice::' + line)
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*CslSpikeTest.xml'):
              root = ET.parse(path).getroot()
              text = root.findtext('system-out', '')
              rows = [line for line in text.splitlines() if line.startswith('COMPARISON_ROW ')]
              if rows:
                  payload = base64.b64encode(zlib.compress('\n'.join(rows).encode('utf-8'))).decode('ascii')
                  print('::notice::COMPARISON_ROWS ' + payload)
              for line in text.splitlines():
                  if line.strip() and not line.startswith('COMPARISON_ROW '): print('::notice::' + line.replace('%', '%25'))
          PYCODE
          fi
          exit "$status"
      - name: Verify release isolation and compare APK sizes
        working-directory: native
        run: |
          ./gradlew assembleRelease testReleaseUnitTest
          release_baseline=$(mktemp -d)
          git -C .. archive 0e4c4bfa28257941520728cdd51753a6439a697d native | tar -x -C "$release_baseline"
          (cd "$release_baseline/native" && ./gradlew assembleRelease)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          python3 ci/check-release-isolation.py app/build/outputs/apk/release/app-release-unsigned.apk "$release_baseline/native/app/build/outputs/apk/release/app-release-unsigned.apk" "$aapt"
          baseline=$(mktemp -d)
          git -C .. archive ba3e3c3157d732dad2269f1b9c518ffa64922b5c native | tar -x -C "$baseline"
          (cd "$baseline/native" && ./gradlew assembleDebug)
          base=$(stat -c %s "$baseline/native/app/build/outputs/apk/debug/app-debug.apk")
          spike=$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)
          echo "Baseline debug APK: $base bytes; spike debug APK: $spike bytes; increase: $((spike-base)) bytes"
          echo "::notice::Baseline debug APK: $base bytes; spike debug APK: $spike bytes; increase: $((spike-base)) bytes"
      - name: Inventory optional-processor markers in release APK
        working-directory: native
        run: |
          python3 - <<'PYCODE'
          import glob, struct, zipfile
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          def strings(data):
              size, off = struct.unpack_from('<II', data, 56)
              for i in range(size):
                  pos = struct.unpack_from('<I', data, off + i * 4)[0]
                  while data[pos] & 128: pos += 1
                  pos += 1
                  end = data.index(b'\0', pos)
                  yield data[pos:end].decode('utf-8', 'replace')
          with zipfile.ZipFile(apk) as z:
              assets = [n for n in z.namelist() if n.startswith('assets/') and ('csl' in n.lower() or 'citeproc' in n.lower())]
              print('Optional processor assets:', assets or '(none)')
              print('::notice::Optional processor assets: ' + (', '.join(assets) if assets else '(none)'))
              for name in z.namelist():
                  if name.endswith('.dex'):
                      matches = sorted(set(s for s in strings(z.read(name)) if 'csl' in s.lower() or 'citeproc' in s.lower() or 'rhino' in s.lower()))
                      print(name + ' matching strings:')
                      for match in matches: print('  ' + repr(match))
                      if not matches: print('  (none)')
                      for match in matches:
                          escaped = repr(match).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::notice::' + name + ' marker: ' + escaped)
          PYCODE
      - name: List release dependency and APK license and notice filenames
        working-directory: native
        run: python3 ci/list-release-licenses.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: |
            native/app/build/reports/tests
            native/app/build/test-results
      - name: Upload sample DOCX files
        uses: actions/upload-artifact@v4
        with:
          name: sample-docx-csl
          path: native/app/build/sample-docx-csl/*.docx
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Blaykie-native-debug
          path: native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  experimental-release:
    name: Experimental optional-processor release (informational)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi
      - name: Compile optional release and run release unit tests
        working-directory: native
        run: |
          set +e
          ./gradlew -PcslInRelease=true assembleRelease testReleaseUnitTest > /tmp/experimental-release.log 2>&1
          status=$?
          cat /tmp/experimental-release.log
          echo "Experimental release compile and tests exit status: $status"
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          import re
          lines = open('/tmp/experimental-release.log').read().splitlines()
          for line in [line for line in lines if re.search(r'(^e: |FAILED|Exception|Error|error:|What went wrong|failure)', line, re.I)][-40:]:
              print('::warning::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$status"
      - name: Confirm runtime switch tests ran in release variant
        working-directory: native
        run: |
          python3 - <<'PYCODE'
          import glob, xml.etree.ElementTree as ET
          for name in ['CustomStylesGateTest', 'SettingsTest']:
              paths = glob.glob(f'app/build/test-results/testReleaseUnitTest/TEST-*{name}.xml')
              assert len(paths) == 1, f'{name} release test report not found'
              root = ET.parse(paths[0]).getroot()
              assert int(root.get('tests', '0')) > 0 and int(root.get('failures', '0')) == 0 and int(root.get('errors', '0')) == 0, f'{name} failed'
              print(f'{name}: {root.get("tests")} release tests passed')
              print(f'::notice::{name}: {root.get("tests")} release tests passed')
          PYCODE
      - name: Print experimental APK asset and class inventory (informational)
        if: always()
        working-directory: native
        run: |
          python3 - <<'PYCODE'
          import glob, struct, zipfile
          try:
              apks = glob.glob('app/build/outputs/apk/release/*.apk')
              if not apks:
                  print('Experimental release APK unavailable; inventory not produced.')
              else:
                  def dex_classes(data):
                      strings_size, strings_off = struct.unpack_from('<II', data, 56)
                      types_size, types_off = struct.unpack_from('<II', data, 64)
                      classes_size, classes_off = struct.unpack_from('<II', data, 96)
                      strings = []
                      for i in range(strings_size):
                          pos = struct.unpack_from('<I', data, strings_off + 4*i)[0]
                          while data[pos] & 128: pos += 1
                          pos += 1
                          end = data.index(b'\0', pos)
                          strings.append(data[pos:end].decode('utf-8', 'replace'))
                      types = [strings[struct.unpack_from('<I', data, types_off + 4*i)[0]] for i in range(types_size)]
                      return [types[struct.unpack_from('<I', data, classes_off + 32*i)[0]] for i in range(classes_size)]
                  with zipfile.ZipFile(apks[0]) as z:
                      assets = sorted(n for n in z.namelist() if n.startswith('assets/'))
                      classes = sorted({c for n in z.namelist() if n.endswith('.dex') for c in dex_classes(z.read(n))
                                        if 'org/blaykie/nativeapp/csl/' in c or 'org/blaykie/nativeapp/citation/style/' in c})
                      print('Experimental release APK assets:')
                      for asset in assets: print('  ' + asset)
                      print('Experimental release citation classes:')
                      for name in classes: print('  ' + name)
                      if not classes: print('  (none)')
                      print('::notice::Experimental release assets: ' + (', '.join(assets) if assets else '(none)'))
                      print('::notice::Experimental citation classes: ' + (', '.join(classes) if classes else '(none)'))
          except Exception as error:
              print('Experimental inventory unavailable:', error)
          PYCODE
